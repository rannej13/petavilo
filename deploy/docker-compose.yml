name: catmarket

x-app: &app
  image: catmarket-app:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage/app
    - logs:/var/www/html/storage/logs
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_APP_NAME: ${SITE_NAME:-Cat Marketplace}
    environment:
      CONTAINER_ROLE: web

  worker:
    <<: *app
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_started

  scheduler:
    <<: *app
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data

  places:
    image: python:3.12-slim
    restart: "no"
    entrypoint: ["sh", "/places/run.sh"]
    volumes:
      - ./places:/places:ro
      - storage:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      REDIRECT_ADDRESS: ${REDIRECT_ADDRESS:-http://redirect.invalid}
      PRIMARY_HOST: ${PRIMARY_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db:
  redis:
  storage:
  logs:
  caddy_data:
  caddy_config:
